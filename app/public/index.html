<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Task Manager</h1>
        <form id="task-form">
          <input id="task-title" type="text" placeholder="Nova tarefa" required />
          <button type="submit">Adicionar</button>
        </form>
        <ul id="task-list"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
